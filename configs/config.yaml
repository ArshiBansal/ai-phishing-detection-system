# config/config.yaml
# PhreshPhish low-false-positive phishing webpage classifier

project:
  name: "phreshphish-classifier"
  version: "1.0.0"
  description: "Robust low-FP phishing webpage classifier using PhreshPhish (HF)"

# Hugging Face dataset (no local download / no sample data)
dataset:
  name: "phreshphish/phreshphish"
  train_split: "train"
  test_split: "test"
  streaming: true          # recommended – dataset ~36 GB
  trust_remote_code: false
  # Optional: limit samples during development (set to null for full)
  max_train_samples: null
  max_test_samples: null
  # Columns used
  text_columns: ["url", "html"]
  label_column: "label"
  label_map:
    benign: 0
    phish: 1

# Preprocessing
preprocessing:
  max_html_length: 50000          # truncate very long HTML
  extract_visible_text: true
  keep_tags: ["title", "a", "form", "input", "script", "img", "meta"]
  remove_scripts_styles: true
  url_normalize: true
  lowercase: true
  min_text_length: 20

# Feature engineering
features:
  url:
    use_lexical: true
    ngram_range: [2, 4]
    max_features: 50000
  html:
    use_structural: true
    use_tfidf: true
    ngram_range: [1, 3]
    max_features: 100000
  combined:
    use_url_html_concat: true

# Classical ML baselines
ml:
  models:
    - name: "logistic"
      type: "LogisticRegression"
      params:
        C: 1.0
        class_weight: "balanced"
        max_iter: 1000
        n_jobs: -1
    - name: "xgboost"
      type: "XGBClassifier"
      params:
        n_estimators: 300
        max_depth: 6
        learning_rate: 0.05
        scale_pos_weight: 1.25
        eval_metric: "logloss"
        n_jobs: -1
  cv_folds: 3
  random_state: 42

# Deep Learning / NLP (Transformers)
dl:
  model_name: "microsoft/deberta-v3-base"   # or "Alibaba-NLP/gte-base-en-v1.5", "distilbert-base-uncased"
  max_seq_length: 512
  batch_size: 16
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-5
  weight_decay: 0.01
  num_epochs: 2
  warmup_ratio: 0.06
  fp16: true
  early_stopping_patience: 2
  # Low-FP focused loss / sampling
  class_weights: [1.0, 1.3]               # slight up-weight for phishing
  focal_loss_gamma: 2.0                   # optional focal loss

# Training
training:
  output_dir: "models/checkpoints"
  logging_steps: 100
  eval_strategy: "steps"
  eval_steps: 500
  save_strategy: "steps"
  save_steps: 1000
  load_best_model_at_end: true
  metric_for_best_model: "average_precision"
  greater_is_better: true
  seed: 42

# Evaluation – prioritise low false-positive rate
evaluation:
  primary_metric: "average_precision"
  secondary_metrics:
    - "precision_at_recall_0.90"
    - "precision_at_recall_0.95"
    - "fpr_at_tpr_0.90"
    - "roc_auc"
  decision_threshold: 0.85                # high threshold for low FP
  base_rates: [0.0005, 0.001, 0.005, 0.01, 0.05]   # realistic phishing rates
  plot_pr_curve: true
  plot_confusion: true

# Inference / App
inference:
  model_path: "models/best_model"
  tokenizer_path: "models/best_model"
  device: "auto"                          # "cuda" | "cpu" | "auto"
  max_length: 512
  batch_size: 8
  return_probability: true
  low_fp_threshold: 0.85

# Gradio / FastAPI app
app:
  framework: "gradio"                     # "gradio" or "fastapi"
  title: "PhreshPhish Low-FP Classifier"
  description: "Robust phishing webpage detector trained on PhreshPhish (HF)"
  share: false
  server_name: "0.0.0.0"
  server_port: 7860
  examples:
    - url: "https://example-login-secure.com/verify"
      html: "<html><head><title>Account Verification</title></head><body>Please enter credentials</body></html>"
    - url: "https://www.wikipedia.org"
      html: "<html><head><title>Wikipedia</title></head><body>Free encyclopedia</body></html>"

# Paths
paths:
  models_dir: "models"
  logs_dir: "logs"
  figures_dir: "figures"
  cache_dir: ".cache/huggingface"