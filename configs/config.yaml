# =========================================================
# Project: AI Phishing Detection System
# Dataset: https://huggingface.co/datasets/phreshphish/phreshphish
# =========================================================

project:
  name: "ai-phishing-detection-system"
  seed: 42
  output_dir: "results"

# ---------------------------------------------------------
# Dataset Configuration
# ---------------------------------------------------------
dataset:
  name: "phreshphish/phreshphish"
  train_split: "train"
  test_split: "test"
  streaming: true                  # Recommended due to large size (~36GB)
  trust_remote_code: false

  # Label mapping (original labels are strings)
  label_column: "label"
  label_map:
    benign: 0
    phish: 1

  text_columns:
    url: "url"
    html: "html"

  # Optional metadata columns
  metadata_columns:
    - "target"
    - "date"
    - "lang"
    - "lang_score"

# ---------------------------------------------------------
# Data Processing
# ---------------------------------------------------------
preprocessing:
  max_html_length: 50000           # Characters (for safety)
  extract_visible_text: true
  remove_scripts_styles: true
  lowercase: true
  min_text_length: 20

# ---------------------------------------------------------
# Feature Engineering
# ---------------------------------------------------------
features:
  url:
    enabled: true
    use_lexical: true
    use_structural: true
    ngram_range: [2, 5]
    max_features: 20000

  html:
    enabled: true
    use_structural: true           # forms, inputs, scripts, iframes, etc.
    use_content: true              # visible text TF-IDF
    ngram_range: [1, 3]
    max_features: 30000

  combine_features: true

# ---------------------------------------------------------
# Classical Models
# ---------------------------------------------------------
classical:
  models:
    - "logistic_regression"
    - "lightgbm"
    - "xgboost"

  logistic_regression:
    max_iter: 1000
    class_weight: "balanced"
    C: 1.0

  lightgbm:
    n_estimators: 500
    learning_rate: 0.05
    max_depth: -1
    num_leaves: 64
    class_weight: "balanced"
    n_jobs: -1

  xgboost:
    n_estimators: 400
    learning_rate: 0.05
    max_depth: 8
    scale_pos_weight: 1.25
    n_jobs: -1

# ---------------------------------------------------------
# Transformer / Deep Learning
# ---------------------------------------------------------
transformer:
  model_name: "distilbert-base-uncased"
  max_length: 512
  use_url: true
  use_title: true
  use_html_text: true
  html_max_chars: 1500             # Truncate HTML text for transformer

  training:
    num_epochs: 3
    train_batch_size: 16
    eval_batch_size: 32
    learning_rate: 2.0e-5
    weight_decay: 0.01
    warmup_ratio: 0.1
    fp16: true
    gradient_accumulation_steps: 2
    evaluation_strategy: "epoch"
    save_strategy: "epoch"
    load_best_model_at_end: true
    metric_for_best_model: "f1"
    greater_is_better: true

# ---------------------------------------------------------
# Training Settings
# ---------------------------------------------------------
training:
  test_size: 0.0                   # We already have official test split
  val_size: 0.1                    # Create validation from train if needed
  random_state: 42
  n_jobs: -1

# ---------------------------------------------------------
# Evaluation
# ---------------------------------------------------------
evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"
    - "average_precision"          # PR-AUC (very important)

  # Focus on low False Positive Rate
  target_fpr: [0.001, 0.005, 0.01, 0.05]
  save_predictions: true
  save_plots: true

# ---------------------------------------------------------
# Paths
# ---------------------------------------------------------
paths:
  models_dir: "results/models"
  metrics_dir: "results/metrics"
  figures_dir: "results/figures"
  logs_dir: "results/logs"