# Classical ML baselines config for PhreshPhish
# Focus: low false-positive rate (high precision)

dataset:
  name: "phreshphish/phreshphish"
  train_split: "train"
  test_split: "test"
  streaming: true          # NEVER download full dataset
  max_train_samples: 80000 # practical streaming limit for classical ML
  max_test_samples: 20000
  seed: 42

features:
  url:
    - url_len
    - domain_len
    - path_len
    - query_len
    - num_dots
    - num_hyphens
    - num_digits
    - has_ip
    - num_subdomains
    - path_depth
    - has_at
    - has_https
  html:
    - html_len
    - num_links
    - num_forms
    - num_scripts
    - num_images
    - num_inputs
    - title_len
    - has_password_field
  text:
    max_chars: 3000        # cleaned visible text from HTML
    use_tfidf: true
    tfidf_max_features: 15000
    ngram_range: [1, 3]
    analyzer: "char_wb"    # character n-grams work well on URLs + HTML

model:
  type: "linear_svc"       # options: linear_svc | logistic | lightgbm
  linear_svc:
    C: 1.0
    class_weight: "balanced"
    max_iter: 5000
    dual: false
  logistic:
    C: 1.0
    class_weight: "balanced"
    max_iter: 1000
    solver: "saga"
  lightgbm:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 63
    class_weight: "balanced"
    random_state: 42

training:
  batch_size: 4096         # for streaming feature extraction
  n_jobs: -1
  random_state: 42

evaluation:
  metrics:
    - average_precision
    - precision_at_recall_0.90
    - precision_at_recall_0.95
    - roc_auc
    - f1
  primary_metric: "precision_at_recall_0.90"   # low-FP focus
  threshold_search: true
  base_rates: [0.0005, 0.001, 0.005, 0.01, 0.05]  # realistic PhreshPhish benchmarks

output:
  model_dir: "models/ml"
  metrics_dir: "outputs/ml"
  save_feature_importance: true